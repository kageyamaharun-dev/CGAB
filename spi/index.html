<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2457d6"><meta name="apple-mobile-web-app-capable" content="yes">
<title>SPI 語句の意味 暗記トレーナー</title>
<style>:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2330;--sub:#5d6675;--line:#e2e5ea;--pri:#2457d6;--pri2:#e8eefc;--ok:#13804a;--okbg:#e3f6ea;--ng:#c62828;--ngbg:#fdeaea;--warn:#a15c00;--warnbg:#fff3df;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:12px 14px 40px}
header.top{display:flex;align-items:center;gap:8px;padding:6px 0 10px}
header.top h1{font-size:18px;margin:0;flex:1;line-height:1.3}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.subjects{display:grid;grid-template-columns:1fr;gap:10px}
.subj{display:block;text-align:left;width:100%;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:16px}
.subj .name{font-size:22px;font-weight:700}
.subj .meta{color:var(--sub);font-size:13px;margin-top:6px;line-height:1.6}
.bar{height:8px;background:#edf0f4;border-radius:99px;overflow:hidden;display:flex;margin-top:8px}
.bar i{display:block;height:100%}
.l0{background:#d5dae2}.l1{background:#f2a33a}.l2{background:#f5d142}.l3{background:#7cc36b}.l4{background:#1f9d55}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:14px 12px;text-align:left;min-height:74px}
.mode b{display:block;font-size:16px}
.mode small{color:var(--sub);font-size:12px;line-height:1.4;display:block;margin-top:4px}
.mode.main{grid-column:1/-1;background:var(--pri);color:#fff;border-color:var(--pri)}
.mode.main small{color:#dce6ff}
.mode[disabled]{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;font-size:14px}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.danger{color:var(--ng);border-color:#f0c4c4}
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub);gap:8px}
.qhead .tag{background:var(--pri2);color:var(--pri);border-radius:99px;padding:3px 10px;font-weight:700;white-space:nowrap}
.passage{font-size:14px;color:var(--sub);background:#f2f4f7;border-radius:10px;padding:8px 10px;margin:10px 0 0;white-space:pre-wrap;word-break:break-word}
.question{font-size:21px;font-weight:700;line-height:1.5;margin:12px 0 4px;white-space:pre-wrap;word-break:break-word}
.qid{font-size:11px;color:#98a0ad;margin-top:2px}
.warnbadge{display:inline-block;background:var(--warnbg);color:var(--warn);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;margin-top:6px}
.choices{display:grid;gap:10px;margin-top:14px}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:14px;font-size:17px;line-height:1.45;min-height:58px;white-space:pre-wrap;word-break:break-word}
.choice .k{flex:0 0 28px;height:28px;border-radius:8px;background:#eef1f5;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:var(--sub)}
.choice:active{transform:scale(.99)}
.choice.correct{border-color:var(--ok);background:var(--okbg)}
.choice.correct .k{background:var(--ok);color:#fff}
.choice.wrong{border-color:var(--ng);background:var(--ngbg)}
.choice.wrong .k{background:var(--ng);color:#fff}
.choice.dim{opacity:.55}
.result{margin-top:14px;border-radius:12px;padding:14px;font-size:16px;line-height:1.5}
.result.ok{background:var(--okbg);color:var(--ok)}
.result.ng{background:var(--ngbg);color:var(--ng)}
.result .big{font-size:24px;font-weight:800}
.result .ans{color:var(--ink);margin-top:6px;font-weight:700;white-space:pre-wrap}
.result .sub{color:var(--sub);font-size:12px;margin-top:8px;white-space:pre-wrap}
.nextbtn{width:100%;margin-top:12px;padding:16px;font-size:18px;font-weight:700;border-radius:12px;border:0;background:var(--pri);color:#fff}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:#f3f5f8;border-radius:10px;padding:10px}
.stat .v{font-size:22px;font-weight:800}
.stat .t{font-size:12px;color:var(--sub)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
th{position:sticky;top:0;background:#fafbfc;font-size:12px;color:var(--sub)}
.tablebox{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:13px}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
input[type=search],input[type=text]{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:15px}
.lv{display:inline-block;min-width:22px;text-align:center;border-radius:6px;padding:1px 4px;font-weight:700;font-size:12px}
.muted{color:var(--sub);font-size:13px;line-height:1.6}
.ok{color:var(--ok)}.ng{color:var(--ng)}.warn{color:var(--warn)}
h2{font-size:17px;margin:4px 0 8px}
h3{font-size:15px;margin:14px 0 6px}
.kbd{font-size:12px;color:#98a0ad;text-align:center;margin-top:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:9;max-width:90vw}
.detail dt{font-size:12px;color:var(--sub);margin-top:8px}
.detail dd{margin:2px 0 0;white-space:pre-wrap;word-break:break-word}
label.sw{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:14px}
label.sw input{width:20px;height:20px;margin-top:1px}
@media(min-width:640px){.subjects{grid-template-columns:1fr 1fr 1fr}.question{font-size:23px}}
.word{font-size:34px;font-weight:800;text-align:center;margin:18px 0 6px;letter-spacing:.04em;word-break:break-word}
.meanq{font-size:20px;font-weight:700;line-height:1.55;margin:14px 0 4px}
.rate{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.rate button{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:12px 4px;font-size:15px;font-weight:700}
.rate .o{border-color:#9fd8b4;color:var(--ok)}.rate .d{border-color:#f0d58a;color:var(--warn)}.rate .x{border-color:#f0b4b4;color:var(--ng)}
.ex{background:#f2f4f7;border-radius:10px;padding:8px 10px;margin-top:8px;color:var(--ink);font-size:14px;font-weight:400}
.memo{background:#fff8e1;border-radius:10px;padding:8px 10px;margin-top:8px;color:#6b4e00;font-size:13px;font-weight:400}
.mates{margin-top:10px;font-size:13px;color:var(--ink);font-weight:400}
.mates div{padding:4px 0;border-top:1px dashed var(--line)}
.flash{min-height:230px;display:flex;flex-direction:column;justify-content:center;text-align:center;cursor:pointer}
.flash .m{font-size:20px;font-weight:700;line-height:1.6;margin-top:10px}
.pill{display:inline-block;border-radius:99px;padding:2px 9px;font-size:12px;background:#eef1f5;color:var(--sub);margin:2px 4px 2px 0}
select{font:inherit;padding:8px;border:1px solid var(--line);border-radius:10px;background:#fff;max-width:100%}
</style>
</head><body><div class="wrap" id="app">読み込み中…</div>

</script><script>/* SPI 語句の意味 暗記トレーナー（サーバー不要・学習履歴は localStorage に保存） */
(function () {
  'use strict';
  const IT = window.SPI_DATA.items;            // Excelの順番どおり（no = 順番）

  const $ = s => document.querySelector(s);

  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const rint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };

  // ---------- 保存 ----------
  function blank() { return { app: 'spi-goku', version: 1, items: {}, step: 0, ptr: 0, daily: {}, settings: { range: 'all', cat: '', dir: 'fw', size: 20 } }; }
  let S = load();
  function load() { try { const s = JSON.parse(localStorage.getItem(STORE_KEY)); if (s && s.items) { const b = blank(); return Object.assign(b, s, { settings: Object.assign(b.settings, s.settings || {}) }); } } catch (e) { } return blank(); }
  function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { toast('保存に失敗しました'); } }
  const st = id => S.items[id] || { n: 0, c: 0, w: 0, streak: 0, level: 0 };
  const acc = s => s.n ? s.c / s.n : 0;
  const isWeak = (s, x) => (s.n ? (s.last === 'wrong' || s.u === 'x' || s.u === 'd' || (s.w > 0 && s.streak < 2)) : !!(x && x.missed));
  const isDue = (s, now) => s.n > 0 && ((s.dueStep != null && S.step >= s.dueStep) || (s.dueAt != null && now >= s.dueAt));

  // ---------- 範囲 ----------
  const BLOCK = 50;
  function ranges() { const r = [['all', '全部（1〜' + IT.length + '）']]; for (let i = 0; i < IT.length; i += BLOCK) r.push([String(i), (i + 1) + '〜' + Math.min(IT.length, i + BLOCK)]); return r; }
  function inScope(x) {
    const r = S.settings.range; if (r !== 'all') { const a = +r; if (x.no <= a || x.no > a + BLOCK) return false; }
    if (S.settings.cat && x.cat !== S.settings.cat) return false; return true;
  }
  const scope = () => IT.filter(inScope);

  // ---------- 記録（間隔反復） ----------
  function record(x, ok) {
    const now = Date.now(), step = ++S.step;
    const s = Object.assign({ n: 0, c: 0, w: 0, streak: 0, level: 0 }, S.items[x.id] || {});
    s.n++; s.lastAt = now; s.last = ok ? 'correct' : 'wrong';
    if (ok) {
      s.c++; s.streak++; const gap = now - (s.okAt || 0);
      if (s.level === 0) { s.level = 1; s.dueStep = step + rint(10, 20); s.dueAt = now + 10 * MIN; }
      else if (s.level === 1) { s.level = 2; s.dueStep = step + rint(25, 45); s.dueAt = now + HOUR; }
      else if (s.level === 2) { if (gap >= HOUR) { s.level = 3; s.dueStep = null; s.dueAt = now + DAY; } else { s.dueStep = step + rint(30, 60); s.dueAt = now + HOUR; } }
      else if (s.level === 3) { if (gap >= 20 * HOUR) { s.level = 4; s.ivl = 3 * DAY; } s.dueStep = null; s.dueAt = now + (s.ivl || DAY); }
      else { s.ivl = Math.min((s.ivl || 3 * DAY) * 2.2, 30 * DAY); s.dueStep = null; s.dueAt = now + s.ivl; }
      s.okAt = now;
    } else { s.w++; s.streak = 0; s.level = 1; s.ivl = 0; s.dueStep = step + rint(4, 10); s.dueAt = now + 10 * MIN; }
    S.items[x.id] = s;
    const d = S.daily[today()] || (S.daily[today()] = { n: 0, c: 0 }); d.n++; if (ok) d.c++;
    save(); return s;
  }
  function rate(x, u) { // 理解度 ○△×（Excelと同じ）
    const s = S.items[x.id]; if (!s) return; s.u = u;
    if (u === 'd') { s.level = Math.min(s.level, 2); s.dueStep = S.step + rint(15, 30); s.dueAt = Date.now() + 30 * MIN; }

    save();
  }

  // ---------- 誤答選択肢（正答はExcelの値そのまま。誤答はExcel内の他の語句から生成） ----------
  function bigr(s) { s = s.replace(/[\s。、，．,.「」()（）・]/g, ''); const r = new Set(); for (let i = 0; i < s.length - 1; i++) r.add(s.slice(i, i + 2)); return r; }
  function sim(a, b) { const A = bigr(a), B = bigr(b); if (!A.size || !B.size) return 0; let k = 0; A.forEach(t => { if (B.has(t)) k++; }); return 2 * k / (A.size + B.size); }
  function distractors(x, dir) {
    const okText = dir === 'fw' ? x.meaning : x.word, used = new Set([okText]), out = [];
    const sameWord = new Set(IT.filter(y => y.word === x.word).map(y => y.meaning));
    const good = y => { if (y.word === x.word) return false; const t = dir === 'fw' ? y.meaning : y.word; if (used.has(t) || sameWord.has(y.meaning)) return false; if (sim(y.meaning, x.meaning) >= 0.5) return false; return true; };
    const take = (arr, n) => { for (const y of shuffle(arr)) { if (out.length >= 3 || n <= 0) break; if (good(y)) { const t = dir === 'fw' ? y.meaning : y.word; used.add(t); out.push(t); n--; } } };
    // 意味→語句 では同じ類似語グループ（意味が近い語）を避け、答えが2つにならないようにする
    if (dir === 'fw' && x.sim) take(IT.filter(y => y.sim === x.sim), 2);
    if (x.trap) take(IT.filter(y => y.trap === x.trap && (dir === 'fw' || y.sim !== x.sim || !x.sim)), 1);
    take(IT.filter(y => y.cat === x.cat && (dir === 'fw' || y.sim !== x.sim || !x.sim)), 3);
    take(IT.filter(y => dir === 'fw' || y.sim !== x.sim || !x.sim), 3);
    return out;
  }

  // ---------- 出題選択 ----------
  let SES = null, CUR = null;
  function nextSmart() {
    const now = Date.now(), sc = scope(), seen = SES.seen;
    const due = sc.filter(x => isDue(st(x.id), now) && x.id !== SES.lastId).sort((a, b) => (st(a.id).dueAt || 0) - (st(b.id).dueAt || 0));
    if (due.length) return due[0];
    const nw = sc.find(x => !st(x.id).n && !seen.has(x.id)); if (nw) return nw;   // 新出は順番どおり
    const weak = sc.filter(x => isWeak(st(x.id), x) && x.id !== SES.lastId); if (weak.length) return weak[rint(0, weak.length - 1)];
    const rest = sc.filter(x => x.id !== SES.lastId).sort((a, b) => (st(a.id).level - st(b.id).level) || ((st(a.id).lastAt || 0) - (st(b.id).lastAt || 0)));
    return rest[0] || sc[0];
  }
  function start(mode) {
    const sc = scope(); if (!sc.length) return toast('範囲に語句がありません');
    let list = null; const n = S.settings.size;
    if (mode === 'order') { let p = sc.findIndex(x => x.no > S.ptr); if (p < 0) p = 0; list = sc.slice(p).concat(sc.slice(0, p)); }
    if (mode === 'random') list = shuffle(sc);
    if (mode === 'weak') { list = shuffle(sc.filter(x => isWeak(st(x.id), x))); if (!list.length) return toast('苦手な語句はまだありません'); }
    if (mode === 'test') list = shuffle(sc).slice(0, Math.min(n, sc.length));
    if (mode === 'cards') { list = sc.slice(); }
    SES = { mode, list, i: 0, done: 0, ok: 0, wrong: [], seen: new Set(), lastId: null, limit: mode === 'test' ? list.length : (mode === 'cards' ? list.length : n) };
    mode === 'cards' ? showCard() : nextQ();
  }
  function nextQ() {
    if (SES.done >= SES.limit || (SES.list && SES.i >= SES.list.length)) return summary();
    const x = SES.list ? SES.list[SES.i++] : nextSmart();
    SES.seen.add(x.id); SES.lastId = x.id;
    let dir = S.settings.dir; if (dir === 'mix') dir = Math.random() < 0.5 ? 'fw' : 'rv';
    const ok = dir === 'fw' ? x.meaning : x.word;
    const ch = shuffle([ok].concat(distractors(x, dir)));
    CUR = { x, dir, ch, ok, answered: false };
    drawQ();
  }

  // ---------- 画面 ----------
  const MODE_NAME = { smart: '今日の学習', order: '順番どおり', random: 'ランダム', weak: '苦手復習', test: '確認テスト', cards: '暗記カード' };
  function head(title, back) { return `<header class="top">${back ? '<button class="iconbtn" data-a="home">← ホーム</button>' : ''}<h1>${esc(title)}</h1></header>`; }
  function counts(list) { const c = [0, 0, 0, 0, 0]; list.forEach(x => c[st(x.id).level]++); return c; }
  function bar(c, tot) { const col = ['l0', 'l1', 'l2', 'l3', 'l4']; return '<div class="bar">' + c.map((v, i) => `<i class="${col[i]}" style="width:${tot ? v / tot * 100 : 0}%"></i>`).join('') + '</div>'; }
  function home() {
    SES = null; CUR = null;
    const sc = scope(), c = counts(sc), all = counts(IT), now = Date.now();
    const due = sc.filter(x => isDue(st(x.id), now)).length, weak = sc.filter(x => isWeak(st(x.id), x)).length, d = S.daily[today()] || { n: 0, c: 0 };
    const cats = [...new Set(IT.map(x => x.cat))];
    $('#app').innerHTML = head('SPI 語句の意味 暗記トレーナー') + `
    <div class="card"><div class="stats">
      <div class="stat"><div class="v">${all[4]}<small style="font-size:13px"> / ${IT.length}</small></div><div class="t">習得済み（全体）</div></div>
      <div class="stat"><div class="v">${IT.length - all[0]}</div><div class="t">学習した語句</div></div>
      <div class="stat"><div class="v">${d.n}<small style="font-size:13px"> 問 ${d.n ? Math.round(d.c / d.n * 100) + '%' : ''}</small></div><div class="t">今日の解答</div></div>
      <div class="stat"><div class="v">${due} / ${weak}</div><div class="t">復習期限 / 苦手（範囲内）</div></div></div>
      ${bar(all, IT.length)}<div class="muted" style="margin-top:6px">${LV.map((n, i) => `${n} ${all[i]}`).join('・')}</div></div>
    <div class="card"><h2>出題範囲・形式</h2>
      <div class="row"><select id="rg">${ranges().map(([v, t]) => `<option value="${v}"${S.settings.range === v ? ' selected' : ''}>${t}</option>`).join('')}</select>
      <select id="ct"><option value="">全カテゴリ</option>${cats.map(t => `<option${S.settings.cat === t ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select></div>
      <div class="filters">${[['fw', '語句→意味'], ['rv', '意味→語句'], ['mix', '両方']].map(([v, t]) => `<button class="chip${S.settings.dir === v ? ' on' : ''}" data-dir="${v}">${t}</button>`).join('')}
      ${[10, 20, 30, 50].map(v => `<button class="chip${S.settings.size === v ? ' on' : ''}" data-size="${v}">${v}問</button>`).join('')}</div>
      <div class="muted">範囲内 ${sc.length}語　${bar(c, sc.length)}</div></div>
    <div class="modes">
      <button class="mode main" data-start="smart"><b>今日の学習（おすすめ）</b><small>復習期限の語句 → 新しい語句をExcelの順番どおり → 苦手、の順に自動出題</small></button>
      <button class="mode" data-start="order"><b>順番どおり</b><small>Excelの順で通し演習（続きから：No.${S.ptr + 1}〜）</small></button>
      <button class="mode" data-start="random"><b>ランダム</b><small>範囲内からシャッフル</small></button>
      <button class="mode" data-start="weak"${weak ? '' : ' disabled'}><b>苦手復習（${weak}）</b><small>間違えた・△×の語句＋シート3の過去ミス</small></button>
      <button class="mode" data-start="test"><b>確認テスト</b><small>${S.settings.size}問ランダムで実力チェック</small></button>
      <button class="mode" data-start="cards"><b>暗記カード</b><small>タップで意味を表示し○△×で自己判定</small></button>
      <button class="mode" data-a="list"><b>語句一覧</b><small>検索・習熟度・メモ確認</small></button>
    </div>
    <div class="card"><div class="row"><button class="btn" data-a="export">学習データ書き出し</button><button class="btn" data-a="import">読み込み</button><button class="btn danger" data-a="reset">リセット</button></div>
      <div class="muted" style="margin-top:8px">出典：${esc(window.SPI_DATA.source)}（語句シート ${IT.length}語）。正解の意味はExcelのまま、誤答の選択肢はExcel内の他の語句の意味から自動生成しています。学習記録はこの端末のブラウザに保存されます。</div></div>`;
    $('#rg').onchange = e => { S.settings.range = e.target.value; save(); home(); };
    $('#ct').onchange = e => { S.settings.cat = e.target.value; save(); home(); };
  }
  function info(x, full) {
    const mates = x.sim ? IT.filter(y => y.sim === x.sim && y.id !== x.id) : [];
    return `<div class="ex">例文：${esc(x.example)}</div>` +
      (x.memo ? `<div class="memo">自分メモ（シート3）：${esc(x.memo)}</div>` : '') +
      (x.alt ? `<div class="memo">シート3の意味：${esc(x.alt)}</div>` : '') +
      (x.dup ? `<div class="memo">この語句はExcelに2回登場します（意味の書き方が異なります）：${IT.filter(y => y.word === x.word).map(y => esc(y.meaning)).join(' ／ ')}</div>` : '') +
      (full !== false && mates.length ? `<div class="mates"><b>類似語グループ「${esc(x.sim)}」</b>${mates.map(y => `<div><b>${esc(y.word)}</b>：${esc(y.meaning)}</div>`).join('')}</div>` : '');
  }
  function drawQ() {
    const { x, dir, ch } = CUR, s = st(x.id);
    const prog = SES.list ? `${SES.done + 1} / ${SES.limit}` : `${SES.done + 1} / ${SES.limit}`;
    $('#app').innerHTML = head(MODE_NAME[SES.mode], true) + `<div class="card">
      <div class="qhead"><span class="tag">${dir === 'fw' ? '語句→意味' : '意味→語句'}</span><span>No.${x.no}・${esc(x.cat)}</span><span>${prog}</span></div>
      ${dir === 'fw' ? `<div class="word">${esc(x.word)}</div><div class="muted" style="text-align:center">の意味として正しいものは？</div>` : `<div class="meanq">${esc(x.meaning)}</div><div class="muted">にあてはまる語句は？</div>`}
      <div class="qid">${LV[s.level]}${s.n ? `・正答 ${s.c}/${s.n}` : ''}${x.missed ? '・シート3で過去ミス(' + x.missed.join('/') + ')' : ''}</div>
      <div class="choices">${ch.map((t, i) => `<button class="choice" data-ch="${i}"><span class="k">${i + 1}</span><span>${esc(t)}</span></button>`).join('')}</div>
      <div id="res"></div></div><div class="kbd">キー操作：1〜4 選択 / Enter 次へ</div>`;
  }
  function answer(i) {
    if (!CUR || CUR.answered) return; CUR.answered = true;
    const { x, ch, ok } = CUR, good = ch[i] === ok;
    record(x, good); SES.done++; if (good) SES.ok++; else SES.wrong.push(x);
    if (SES.mode === 'order') { S.ptr = x.no % IT.length; save(); }
    document.querySelectorAll('.choice').forEach((b, k) => { b.disabled = true; if (ch[k] === ok) b.classList.add('correct'); else if (k === i) b.classList.add('wrong'); else b.classList.add('dim'); });
    const wrongPick = !good ? IT.find(y => (CUR.dir === 'fw' ? y.meaning : y.word) === ch[i]) : null;
    $('#res').innerHTML = `<div class="result ${good ? 'ok' : 'ng'}"><div class="big">${good ? '○ 正解' : '× 不正解'}</div>
      <div class="ans">${esc(x.word)}：${esc(x.meaning)}</div>
      ${wrongPick ? `<div class="sub">選んだ「${esc(CUR.dir === 'fw' ? ch[i] : wrongPick.word)}」は ${esc(CUR.dir === 'fw' ? wrongPick.word + ' の意味' : wrongPick.meaning)}</div>` : ''}
      ${info(x)}</div>
      ${SES.mode === 'test' ? '' : `<div class="muted" style="margin-top:10px">理解度（任意）：○＝分かった　△＝微妙　×＝分からない</div><div class="rate"><button class="o" data-rate="o">○</button><button class="d" data-rate="d">△</button><button class="x" data-rate="x">×</button></div>`}
      <button class="nextbtn" data-a="next">次へ</button>`;
  }
  function showCard(flip) {
    if (SES.i >= SES.list.length) return summary();
    const x = SES.list[SES.i];
    $('#app').innerHTML = head('暗記カード', true) + `<div class="card flash" data-a="flip">
      <div class="qhead"><span class="tag">No.${x.no}</span><span>${esc(x.cat)}</span><span>${SES.i + 1} / ${SES.list.length}</span></div>
      <div class="word">${esc(x.word)}</div>
      ${flip ? `<div class="m">${esc(x.meaning)}</div><div style="text-align:left">${info(x)}</div>` : '<div class="muted">タップで意味を表示</div>'}</div>
      ${flip ? `<div class="rate"><button class="o" data-card="o">○ 分かった</button><button class="d" data-card="d">△ 微妙</button><button class="x" data-card="x">× 分からない</button></div>` : ''}
      <div class="row" style="margin-top:10px"><button class="btn" data-a="cprev">← 前へ</button><button class="btn" data-a="cskip">次へ →</button></div>`;
    SES.flip = !!flip;
  }
  function cardRate(u) {
    const x = SES.list[SES.i];
    record(x, u !== 'x'); rate(x, u); SES.done++; if (u === 'o') SES.ok++; else SES.wrong.push(x);
    SES.i++; showCard();
  }
  function summary() {
    const n = SES.done, w = [...new Map(SES.wrong.map(x => [x.id, x])).values()];
    $('#app').innerHTML = head(MODE_NAME[SES.mode] + '　結果', true) + `<div class="card"><div class="stats">
      <div class="stat"><div class="v">${SES.ok} / ${n}</div><div class="t">${SES.mode === 'cards' ? '○の数' : '正解数'}</div></div>
      <div class="stat"><div class="v">${n ? Math.round(SES.ok / n * 100) : 0}%</div><div class="t">正答率</div></div></div>
      ${w.length ? `<h3>${SES.mode === 'cards' ? '△×の語句' : '間違えた語句'}（${w.length}）</h3><div class="tablebox"><table>${w.map(x => `<tr><td><b>${esc(x.word)}</b></td><td>${esc(x.meaning)}</td></tr>`).join('')}</table></div>` : '<p class="ok"><b>全問正解！</b></p>'}
      <div class="row" style="margin-top:12px">${w.length ? '<button class="btn pri" data-a="redo">間違えた語句をもう一度</button>' : ''}<button class="btn pri" data-start="${SES.mode}">もう一度</button><button class="btn" data-a="home">ホーム</button></div></div>`;
  }
  let LQ = '', LF = 'all';
  function list() {
    SES = null;
    const q = LQ.trim(), now = Date.now();
    const f = { all: () => true, weak: x => isWeak(st(x.id), x), new: x => !st(x.id).n, done: x => st(x.id).level === 4, due: x => isDue(st(x.id), now), missed: x => !!x.missed, memo: x => !!(x.memo || x.alt), dup: x => x.dup };
    const rows = IT.filter(x => f[LF](x) && (!q || (x.word + x.meaning + x.example + x.cat + x.sim).includes(q)));
    $('#app').innerHTML = head('語句一覧', true) + `<div class="card"><input type="search" id="q" placeholder="語句・意味・例文で検索" value="${esc(q)}">
      <div class="filters">${[['all', '全部'], ['weak', '苦手'], ['due', '復習期限'], ['new', '未学習'], ['done', '習得済み'], ['missed', 'シート3過去ミス'], ['memo', 'メモあり'], ['dup', '2回登場']].map(([v, t]) => `<button class="chip${LF === v ? ' on' : ''}" data-lf="${v}">${t}</button>`).join('')}</div>
      <div class="muted">${rows.length}語</div>
      <div class="tablebox"><table><tr><th>No</th><th>語句</th><th>意味</th><th>習熟</th></tr>${rows.map(x => { const s = st(x.id); return `<tr data-det="${esc(x.id)}"><td>${x.no}</td><td><b>${esc(x.word)}</b></td><td>${esc(x.meaning)}</td><td><span class="lv l${s.level}">${s.level}</span>${s.n ? `<div class="muted">${s.c}/${s.n}${s.u ? ' ' + { o: '○', d: '△', x: '×' }[s.u] : ''}</div>` : ''}</td></tr>`; }).join('')}</table></div></div>`;
    const inp = $('#q'); inp.oninput = e => { LQ = e.target.value; const p = e.target.selectionStart; list(); const n = $('#q'); n.focus(); n.setSelectionRange(p, p); };
  }
  function detail(id) {
    const x = BY[id], s = st(id);
    $('#app').innerHTML = head('語句の詳細', false) + `<div class="card"><div class="qhead"><span class="tag">No.${x.no}</span><span>${esc(x.cat)}</span></div>
      <div class="word">${esc(x.word)}</div><div class="m" style="font-size:18px;font-weight:700">${esc(x.meaning)}</div>${info(x)}
      <div style="margin-top:8px">${x.sim ? `<span class="pill">類似語：${esc(x.sim)}</span>` : ''}${x.trap ? `<span class="pill">ひっかけ：${esc(x.trap)}</span>` : ''}</div>
      <p class="muted">${LV[s.level]}・正答 ${s.c}/${s.n}${s.u ? '・理解度 ' + { o: '○', d: '△', x: '×' }[s.u] : ''}</p>
      <button class="btn" data-a="list">← 一覧へ</button></div>`;
  }
  function toast(m) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }

  // ---------- 操作 ----------
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-a],[data-start],[data-ch],[data-rate],[data-card],[data-dir],[data-size],[data-lf],[data-det]'); if (!b || b.disabled) return;
    const d = b.dataset;
    if (d.start) return start(d.start);
    if (d.ch != null) return answer(+d.ch);
    if (d.rate) { rate(CUR.x, d.rate); if (d.rate !== 'o' && !SES.wrong.includes(CUR.x)) SES.wrong.push(CUR.x); return nextQ(); }
    if (d.card) return cardRate(d.card);
    if (d.dir) { S.settings.dir = d.dir; save(); return home(); }
    if (d.size) { S.settings.size = +d.size; save(); return home(); }
    if (d.lf) { LF = d.lf; return list(); }
    if (d.det) return detail(d.det);
    switch (d.a) {
      case 'home': return home();
      case 'list': return list();
      case 'next': return nextQ();
      case 'flip': return SES.flip ? null : showCard(true);
      case 'cskip': SES.i++; return showCard();
      case 'cprev': SES.i = Math.max(0, SES.i - 1); return showCard();
      case 'redo': { const w = [...new Map(SES.wrong.map(x => [x.id, x])).values()]; const m = SES.mode === 'cards' ? 'cards' : 'random'; SES = { mode: m, list: shuffle(w), i: 0, done: 0, ok: 0, wrong: [], seen: new Set(), limit: w.length }; return m === 'cards' ? showCard() : nextQ(); }
      case 'export': { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S)], { type: 'application/json' })); a.download = 'spi_goku_progress_' + today() + '.json'; a.click(); return; }
      case 'import': { const i = document.createElement('input'); i.type = 'file'; i.accept = '.json,application/json'; i.onchange = () => { const r = new FileReader(); r.onload = () => { try { const s = JSON.parse(r.result); if (!s.items || s.app !== 'spi-goku') throw 0; localStorage.setItem(STORE_KEY, JSON.stringify(s)); S = load(); toast('読み込みました'); home(); } catch (e) { toast('読み込めないファイルです'); } }; r.readAsText(i.files[0]); }; i.click(); return; }
      case 'reset': if (confirm('学習記録をすべて消去しますか？')) { S = blank(); save(); home(); } return;
    }
  });
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    if (CUR && !CUR.answered && /^[1-4]$/.test(e.key) && document.querySelector('.choice')) return answer(+e.key - 1);
    if (e.key === 'Enter' && document.querySelector('.nextbtn')) return nextQ();
  });
  home();
})();
</script>
</body></html>
