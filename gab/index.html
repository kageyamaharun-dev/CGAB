<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2457d6">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>GAB 対策トレーナー（10月更新版）</title>
<style>:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2330;--sub:#5d6675;--line:#e2e5ea;--pri:#2457d6;--pri2:#e8eefc;--ok:#13804a;--okbg:#e3f6ea;--ng:#c62828;--ngbg:#fdeaea;--warn:#a15c00;--warnbg:#fff3df;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:12px 14px 40px}
header.top{display:flex;align-items:center;gap:8px;padding:6px 0 10px}
header.top h1{font-size:18px;margin:0;flex:1;line-height:1.3}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.subjects{display:grid;grid-template-columns:1fr;gap:10px}
.subj{display:block;text-align:left;width:100%;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:16px}
.subj .name{font-size:22px;font-weight:700}
.subj .meta{color:var(--sub);font-size:13px;margin-top:6px;line-height:1.6}
.bar{height:8px;background:#edf0f4;border-radius:99px;overflow:hidden;display:flex;margin-top:8px}
.bar i{display:block;height:100%}
.l0{background:#d5dae2}.l1{background:#f2a33a}.l2{background:#f5d142}.l3{background:#7cc36b}.l4{background:#1f9d55}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:14px 12px;text-align:left;min-height:74px}
.mode b{display:block;font-size:16px}
.mode small{color:var(--sub);font-size:12px;line-height:1.4;display:block;margin-top:4px}
.mode.main{grid-column:1/-1;background:var(--pri);color:#fff;border-color:var(--pri)}
.mode.main small{color:#dce6ff}
.mode[disabled]{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;font-size:14px}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.danger{color:var(--ng);border-color:#f0c4c4}
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub);gap:8px}
.qhead .tag{background:var(--pri2);color:var(--pri);border-radius:99px;padding:3px 10px;font-weight:700;white-space:nowrap}
.passage{font-size:14px;color:var(--sub);background:#f2f4f7;border-radius:10px;padding:8px 10px;margin:10px 0 0;white-space:pre-wrap;word-break:break-word}
.question{font-size:21px;font-weight:700;line-height:1.5;margin:12px 0 4px;white-space:pre-wrap;word-break:break-word}
.qid{font-size:11px;color:#98a0ad;margin-top:2px}
.warnbadge{display:inline-block;background:var(--warnbg);color:var(--warn);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;margin-top:6px}
.choices{display:grid;gap:10px;margin-top:14px}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:14px;font-size:17px;line-height:1.45;min-height:58px;white-space:pre-wrap;word-break:break-word}
.choice .k{flex:0 0 28px;height:28px;border-radius:8px;background:#eef1f5;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:var(--sub)}
.choice:active{transform:scale(.99)}
.choice.correct{border-color:var(--ok);background:var(--okbg)}
.choice.correct .k{background:var(--ok);color:#fff}
.choice.wrong{border-color:var(--ng);background:var(--ngbg)}
.choice.wrong .k{background:var(--ng);color:#fff}
.choice.dim{opacity:.55}
.result{margin-top:14px;border-radius:12px;padding:14px;font-size:16px;line-height:1.5}
.result.ok{background:var(--okbg);color:var(--ok)}
.result.ng{background:var(--ngbg);color:var(--ng)}
.result .big{font-size:24px;font-weight:800}
.result .ans{color:var(--ink);margin-top:6px;font-weight:700;white-space:pre-wrap}
.result .sub{color:var(--sub);font-size:12px;margin-top:8px;white-space:pre-wrap}
.nextbtn{width:100%;margin-top:12px;padding:16px;font-size:18px;font-weight:700;border-radius:12px;border:0;background:var(--pri);color:#fff}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:#f3f5f8;border-radius:10px;padding:10px}
.stat .v{font-size:22px;font-weight:800}
.stat .t{font-size:12px;color:var(--sub)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
th{position:sticky;top:0;background:#fafbfc;font-size:12px;color:var(--sub)}
.tablebox{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:13px}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
input[type=search],input[type=text]{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:15px}
.lv{display:inline-block;min-width:22px;text-align:center;border-radius:6px;padding:1px 4px;font-weight:700;font-size:12px}
.muted{color:var(--sub);font-size:13px;line-height:1.6}
.ok{color:var(--ok)}.ng{color:var(--ng)}.warn{color:var(--warn)}
h2{font-size:17px;margin:4px 0 8px}
h3{font-size:15px;margin:14px 0 6px}
.kbd{font-size:12px;color:#98a0ad;text-align:center;margin-top:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:9;max-width:90vw}
.detail dt{font-size:12px;color:var(--sub);margin-top:8px}
.detail dd{margin:2px 0 0;white-space:pre-wrap;word-break:break-word}
label.sw{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:14px}
label.sw input{width:20px;height:20px;margin-top:1px}
@media(min-width:640px){.subjects{grid-template-columns:1fr 1fr 1fr}.question{font-size:23px}}
/* ---- GAB10 追加 ---- */
.theme{background:#f2f5fb;border:1px solid #dfe6f5;border-radius:12px;padding:10px 12px;margin-bottom:10px}
.theme .tno{display:inline-block;background:var(--pri);color:#fff;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:700;margin-right:6px}
.theme .tt{font-weight:700;font-size:15px;line-height:1.5;word-break:break-word}
.theme .tnote{font-size:12px;color:var(--warn);margin-top:4px}
.dots{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
.dot{min-width:30px;height:24px;border-radius:7px;background:#e6e9ef;color:var(--sub);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 6px;border:2px solid transparent}
.dot.cur{border-color:var(--pri);background:#fff;color:var(--pri)}
.dot.o{background:var(--ok);color:#fff}.dot.x{background:var(--ng);color:#fff}
.seq{font-size:26px;font-weight:800;letter-spacing:.25em;margin:6px 0}
.sumrow{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.sumrow:last-child{border-bottom:0}
.sumrow .m{flex:0 0 26px;font-size:20px;font-weight:800;text-align:center}
.sumrow .b{flex:1;min-width:0;font-size:14px;line-height:1.5;word-break:break-word}
.sumrow .a{color:var(--ink);font-weight:700;margin-top:2px}
.sumrow .s{font-size:12px;color:var(--sub)}
.unit{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;margin:8px 0}
.unit .h{display:flex;gap:8px;align-items:flex-start}
.unit .h .t{flex:1;min-width:0;font-weight:700;font-size:14px;line-height:1.5;word-break:break-word}
.unit .h .n{color:var(--pri);font-weight:800;font-size:13px;white-space:nowrap}
.unit .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.unit .acts .btn{padding:6px 10px;font-size:13px}
.unit details{margin-top:6px}
.unit summary{font-size:13px;color:var(--pri);cursor:pointer}
.unit ol{margin:6px 0 0;padding-left:22px;font-size:13px;line-height:1.55}
.unit ol li{margin:4px 0;word-break:break-word}
.unit ol .ca{font-weight:700;color:var(--ok)}
.unit.off{opacity:.6}
.dot.l0{background:#e6e9ef}.dot.l1{background:var(--ng);color:#fff}.dot.l2{background:#f5d142;color:#5a4700}.dot.l3{background:#7cc36b;color:#fff}.dot.l4{background:#1f9d55;color:#fff}
.selfbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.selfbtns button{padding:16px;font-size:18px;font-weight:800;border-radius:12px;border:0;color:#fff}
.selfbtns .o{background:var(--ok)}.selfbtns .x{background:var(--ng)}
.reveal{width:100%;margin-top:14px;padding:16px;font-size:18px;font-weight:700;border-radius:12px;border:2px dashed var(--pri);background:var(--pri2);color:var(--pri)}
.ansbox{margin-top:14px;border-radius:12px;padding:14px;background:#fffbea;border:1px solid #f0e2a8;font-size:18px;font-weight:700;white-space:pre-wrap;word-break:break-word}
.ansbox .sub{font-size:12px;color:var(--sub);font-weight:400;margin-top:6px}
.star{color:#e2a400;font-weight:800}
.prog{font-size:12px;color:var(--sub);text-align:right}
select{font:inherit;padding:8px;border:1px solid var(--line);border-radius:10px;background:#fff}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--sub);margin-top:6px}
.legend span{display:flex;align-items:center;gap:4px}.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
/* 問題編集 */
.editbadge{display:inline-block;background:var(--pri2);color:var(--pri);border-radius:5px;padding:1px 6px;font-size:11px;font-weight:700}
.editline{display:flex;gap:7px;align-items:center;margin:6px 0 12px;flex-wrap:wrap}
.smallbtn{font-size:12px;padding:5px 10px}
.editfield{display:block;font-size:14px;font-weight:700;margin:18px 0 8px}
.editfield textarea,.editfield select{display:block;width:100%;margin-top:6px;font:inherit;font-weight:400;font-size:16px;line-height:1.55;border:1px solid #cbd2dd;border-radius:10px;padding:10px;background:#fff;color:var(--ink)}
.editfield textarea{resize:vertical;min-height:80px}
.editfield select{max-width:100%}
.editfield textarea:focus,.editfield select:focus{outline:2px solid var(--pri);outline-offset:1px}
.editerror{color:var(--ng);font-size:14px;line-height:1.5;margin:12px 0;font-weight:700}
.original-text{font-size:13px;white-space:pre-wrap;word-break:break-word;margin-top:10px;line-height:1.6}
.unit.off{opacity:1;background:#f4f5f7}
.unit li{white-space:pre-wrap}
#qedit .row .btn{min-height:44px}
@media(max-width:480px){.editfield select{font-size:14px}.editline .btn{min-height:38px}}
</style>

    b.settings.fmt = Object.assign(blank().settings.fmt, (s.settings || {}).fmt || {});
    return b;
  }
  let S;
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); return true; }
    catch (e) { toast('保存できませんでした（容量・ブラウザの設定を確認してください）'); return false; }
  }

  function lv(id) {
    const it = S.items[id];
    if (!it || !it.n) return 0;
    if (!it.ok) return 1;
    return Math.min(4, 1 + it.st);
  }
  const seen = id => lv(id) > 0;
  const isWrong = id => lv(id) === 1;
  function record(id, ok) {
    const it = S.items[id] || { n: 0, c: 0, w: 0, st: 0 };
    it.n++; if (ok) { it.c++; it.st++; } else { it.w++; it.st = 0; }
    it.ok = ok; it.t = Date.now();
    S.items[id] = it;
    const d = today(); const dd = S.daily[d] || { n: 0, c: 0 }; dd.n++; if (ok) dd.c++; S.daily[d] = dd;
    save();
  }
  function subjStats(sub) {
    const ids = UNITS[sub].flatMap(u => u.play);
    const c = [0, 0, 0, 0, 0]; ids.forEach(id => c[lv(id)]++);
    const units = UNITS[sub].filter(u => u.play.length);
    return {
      total: ids.length, lv: c, seen: ids.length - c[0], units: units.length,
      wrongUnits: units.filter(u => u.play.some(isWrong)).length,
      unseenUnits: units.filter(u => u.play.some(id => !seen(id))).length,
      doneUnits: units.filter(u => u.play.every(seen)).length,
    };
  }

  // ---------- 選択肢 ----------
  function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  const CJK = /[\u3040-\u30ff\u3400-\u9fff]/;
  // 表示用の整形（正答データ自体は変更しない）：訳語や括弧メモを全選択肢で同じように外し、見た目の差で正答が分からないようにする
  function dispOpt(text, sub) {
    let t = half(text).replace(/\s*\n\s*/g, ' ');
    if (sub === 'V') return t;
    const orig = t;
    t = t.replace(/^[A-Ea-e][.．:：)）]\s+/, '').replace(/\s*←.*$/, '');
    if (sub === 'M') t = t.replace(/[（(][^（()）]*[)）]/g, '');
    else {
      const main = t.replace(/[（(][^（()）]*[)）]/g, '');
      const asc = main.replace(/\s/g, '');
      const ratio = asc.length ? [...asc].filter(c => c.charCodeAt(0) < 128).length / asc.length : 0;
      if (ratio >= 0.7) t = t.replace(/[（(][^（()）]*[)）]/g, m => CJK.test(m) ? '' : m);
      t = t.replace(/[（(](自信ない|多分|たぶん|未確認|[?？]+)[)）]/g, '');
    }
    t = t.replace(/\s{2,}/g, ' ').trim();
    return t || orig;
  }
  function buildChoices(q) {
    const ca = q.correctAnswer;
    if (q.type === 'abc') return ['A', 'B', 'C'].map(x => ({ text: x, correct: x === ca, label: ABC_LABEL[x], k: x }));
    const lab = x => dispOpt(x, q.subject);
    const seenK = new Set([key(ca), key(lab(ca))]);
    const ds = shuffle(q.distractors || []).filter(d => { const k = key(d), kl = key(lab(d)); if (!k || seenK.has(k) || seenK.has(kl)) return false; seenK.add(k); seenK.add(kl); return true; }).slice(0, 3);
    return shuffle([{ text: ca, correct: true }].concat(ds.map(d => ({ text: d, correct: false })))).map((o, i) => Object.assign(o, { label: lab(o.text), k: String(i + 1) }));
  }
  const ansText = q => q.type === 'abc' ? ABC_LABEL[q.correctAnswer] : half(q.correctAnswer);
  const qText = q => q.question ? q.question : '（Excelに問題文の記載なし）';
  const fmtOf = sub => sub === 'V' ? 'choice' : S.settings.fmt[sub];

  S = load();
  applyQuestionEdits();

  // ---------- セッション（テーマ単位のキュー。テーマ内は必ず番号順・連続） ----------
  let SES = null;
  function buildOrder(sub, mode, arg) {
    const list = UNITS[sub].filter(u => u.play.length);
    switch (mode) {
      case 'seq': { const st = arg != null ? arg : (S.ptr[sub] || 0); const r = list.filter(u => u.idx >= st); return r.length ? r : list; }
      case 'rand': return shuffle(list);
      case 'wrong': return list.filter(u => u.play.some(isWrong));
      case 'unseen': return list.filter(u => u.play.some(id => !seen(id)));
      case 'hard': return list.filter(u => u.play.some(id => (QBY[id].level || '').length >= 3));
      case 'one': return list.filter(u => u.idx === arg);
    }
    return [];
  }
  const MODE_NAME = { seq: '順番に', rand: 'ランダム順', wrong: '間違えた', unseen: '未出題', hard: '★3以上', one: '1テーマ' };
  function start(sub, mode, arg) {
    const order = buildOrder(sub, mode, arg);
    if (!order.length) { toast(mode === 'wrong' ? '間違えた' + SUBJ[sub].u + 'はありません' : mode === 'unseen' ? '未出題の' + SUBJ[sub].u + 'はありません' : '出題できる問題がありません'); return; }
    SES = { sub, mode, units: order.map(u => u.idx), ui: 0, qi: 0, res: [], n: 0, c: 0, log: [] };
    renderQ();
  }
  const curUnit = () => UNITS[SES.sub][SES.units[SES.ui]];

  // ---------- 画面 ----------
  const $app = document.getElementById('app');
  let keyHandler = null;
  function view(html, kh) { $app.innerHTML = html; keyHandler = kh || null; window.scrollTo(0, 0); }
  function toast(m) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }
  function bar(c) { const t = c.reduce((a, b) => a + b, 0) || 1; return `<div class="bar">${c.map((v, i) => `<i class="l${i}" style="width:${v / t * 100}%"></i>`).join('')}</div>`; }
  const legend = `<div class="legend"><span><i class="l0"></i>未出題</span><span><i style="background:var(--ng)"></i>前回×</span><span><i class="l2"></i>1回○</span><span><i class="l3"></i>2連続○</span><span><i class="l4"></i>3連続○（定着）</span></div>`;
  const brk = t => /^[「『]/.test(t) ? t : '「' + t + '」';
  const unitName = (sub, u) => sub === 'M' ? `No.${u.no}` : `テーマ No.${u.no}`;

  function renderHome() {
    SES = null;
    const d = S.daily[today()] || { n: 0, c: 0 };
    const cards = ORDER.map(s => {
      const st = subjStats(s); const p = S.ptr[s] || 0; const nu = UNITS[s][p] || UNITS[s][0];
      return `<button class="subj" data-act="subj" data-s="${s}"><div class="name">${SUBJ[s].name}</div>
        <div class="meta">${s === 'M' ? `${st.total}問` : `${st.units}テーマ・${st.total}問`}<br>出題済み ${st.seen}/${st.total}　定着 ${st.lv[4]}<br>${st.lv[1] ? `<span class="ng">前回× ${st.lv[1]}問</span>　` : ''}続き：${s === 'M' ? 'No.' + nu.no : 'テーマ' + nu.no}</div>${bar(st.lv)}</button>`;
    }).join('');
    view(`<header class="top"><h1>GAB 対策トレーナー<br><small class="muted">10月更新版</small></h1><button class="iconbtn" data-act="settings">設定</button></header>
      <div class="subjects">${cards}</div>${legend}
      <div class="card"><div class="stats"><div class="stat"><div class="v">${d.n}</div><div class="t">今日の回答数</div></div><div class="stat"><div class="v">${d.n ? Math.round(d.c / d.n * 100) : 0}%</div><div class="t">今日の正答率</div></div></div>
      <p class="muted" style="margin:10px 0 0">言語・英語は<b>同じテーマの問題を、番号順にまとめて連続で</b>出題します（例：テーマ1の問1→問2→問3→問4 → 次のテーマ）。</p></div>`);
  }

  function renderSubj(sub) {
    SES = null;
    const st = subjStats(sub); const U = UNITS[sub]; const u = SUBJ[sub].u;
    const p = S.ptr[sub] || 0; const nu = U[p] || U[0];
    const nuTxt = sub === 'M' ? `No.${nu.no}` : `テーマ No.${nu.no}${esc(brk(nu.title))}`;
    const hard = sub === 'M' ? `<button class="mode" data-act="start" data-s="M" data-m="hard"><b>★3以上の問題</b><small>難易度★★★・★★★★だけを番号順に</small></button>` : '';
    view(`<header class="top"><button class="iconbtn" data-act="home">←</button><h1>${SUBJ[sub].name}</h1><button class="iconbtn" data-act="list" data-s="${sub}">一覧</button></header>
      <div class="card"><div class="stats">
        <div class="stat"><div class="v">${st.seen}<small style="font-size:13px">/${st.total}</small></div><div class="t">出題済みの問題</div></div>
        <div class="stat"><div class="v">${st.lv[4]}</div><div class="t">定着（3連続○）</div></div>
        ${sub === 'M' ? '' : `<div class="stat"><div class="v">${st.doneUnits}<small style="font-size:13px">/${st.units}</small></div><div class="t">全問解いたテーマ</div></div>`}
        <div class="stat"><div class="v ${st.lv[1] ? 'ng' : ''}">${st.lv[1]}</div><div class="t">前回×の問題</div></div>
      </div>${bar(st.lv)}</div>
      <div class="modes">
        <button class="mode main" data-act="start" data-s="${sub}" data-m="seq"><b>▶ 順番に解く（続きから）</b><small>${nuTxt} から${sub === 'M' ? '番号順' : '。テーマ内は問1から番号順に連続'}</small></button>
        <button class="mode" data-act="start" data-s="${sub}" data-m="rand"><b>${sub === 'M' ? 'ランダム順' : 'テーマをランダム順'}</b><small>${sub === 'M' ? '全問をシャッフル' : 'テーマの順番だけシャッフル（テーマ内は番号順）'}</small></button>
        <button class="mode" data-act="start" data-s="${sub}" data-m="wrong" ${st.wrongUnits ? '' : 'disabled'}><b>間違えた${u}（${st.wrongUnits}）</b><small>${sub === 'M' ? '前回×の問題' : '前回×を含むテーマを丸ごと問1から'}</small></button>
        <button class="mode" data-act="start" data-s="${sub}" data-m="unseen" ${st.unseenUnits ? '' : 'disabled'}><b>未出題の${u}（${st.unseenUnits}）</b><small>${sub === 'M' ? 'まだ解いていない問題' : '未出題の問題を含むテーマ'}</small></button>
        ${hard}
        <button class="mode" data-act="list" data-s="${sub}"><b>一覧から選ぶ</b><small>${u}を選んで「ここから」「この${u}だけ」／答えの確認</small></button>
      </div>
      ${sub !== 'V' ? `<p class="muted">回答形式：${fmtOf(sub) === 'choice' ? '4択' : '自己採点（答えを見て○×）'}　<a href="#" data-act="settings">変更</a></p>` : '<p class="muted">回答形式：A／B／Cの3択（Aは明らかに正しい・Bは明らかに間違い・Cは判断できない）</p>'}
      <p class="muted"><a href="#" data-act="resetptr" data-s="${sub}">続きの位置を最初（${sub === 'M' ? 'No.1' : 'テーマ1'}）に戻す</a></p>`);
  }

  function themeBox(u, qi, res) {
    const sub = SES.sub;
    const dots = u.play.map((id, i) => {
      const r = res[i]; const cls = i === qi && r == null ? 'cur' : r === true ? 'o' : r === false ? 'x' : '';
      return `<span class="dot ${cls}">問${QBY[id].pos}</span>`;
    }).join('');
    if (sub === 'M') {
      const q = QBY[u.play[0]];
      return `<div class="qhead"><span class="tag">計数 No.${u.no}</span><span>${q.level ? `難易度 <span class="star">${esc(q.level)}</span>` : ''}</span></div>`;
    }
    return `<div class="theme"><span class="tno">${SUBJ[sub].name} テーマ${u.no}</span><span class="tt">${esc(u.title)}</span>
      ${u.note ? `<div class="tnote">※${esc(u.note)}</div>` : ''}${u.play.length < u.ids.length ? `<div class="tnote">※答えの記載がない問題は除外</div>` : ''}
      <div class="dots">${dots}</div></div>`;
  }

  function renderQ() {
    const u = curUnit(); const sub = SES.sub; const id = u.play[SES.qi]; const q = QBY[id];
    const fmt = fmtOf(sub);
    SES.answered = false; SES.choices = fmt === 'choice' ? buildChoices(q) : null;
    const top = `<header class="top"><button class="iconbtn" data-act="quit">終了</button><h1 style="font-size:15px">${SUBJ[sub].name}・${MODE_NAME[SES.mode]}</h1>
      <div class="prog">${SUBJ[sub].u} ${SES.ui + 1}/${SES.units.length}<br>回答 ${SES.n}（○${SES.c}）</div></header>`;
    const qnum = sub === 'M' ? '' : `<div class="qhead"><span class="tag">問${q.pos}（${SES.qi + 1}/${u.play.length}）</span><span class="qid">${esc(q.excelNo || '')}</span></div>`;
    let body;
    if (fmt === 'choice') body = `<div class="choices">${SES.choices.map((o, i) => `<button class="choice" data-act="ans" data-i="${i}"><span class="k">${o.k}</span><span>${esc(o.label)}</span></button>`).join('')}</div>`;
    else body = `<button class="reveal" data-act="reveal">答えを見る（Space）</button>`;
    view(`${top}<div class="card">${themeBox(u, SES.qi, SES.res)}${qnum}
      <div class="question">${esc(qText(q))}</div>${sub === 'M' ? `<div class="qid">${esc(q.excelNo || '')}</div>` : ''}
      ${body}<div id="fb"></div></div>
      <div class="kbd">${fmt === 'choice' ? (sub === 'V' ? 'キー：A / B / C' : 'キー：1〜4') + '　次へ：Enter' : '答え：Space　○：1 / ×：2'}</div>`, keyQ);
  }

  function keyQ(e) {
    if (!SES) return;
    const k = e.key.toLowerCase();
    if (SES.answered) { if (k === 'enter' || k === ' ') { e.preventDefault(); next(); } return; }
    if (SES.choices) {
      const i = SES.choices.findIndex(o => o.k.toLowerCase() === k);
      if (i >= 0) { e.preventDefault(); answer(i); }
    } else {
      const rv = document.querySelector('[data-act=reveal]');
      if (rv && (k === ' ' || k === 'enter')) { e.preventDefault(); reveal(); }
      else if (!rv && (k === '1' || k === 'o')) selfGrade(true);
      else if (!rv && (k === '2' || k === 'x')) selfGrade(false);
    }
  }
  function memoHtml(q) {
    const x = [];
    if (q.memo) x.push('備考：' + q.memo);
    if (q.subject === 'M' && q.level) x.push('難易度：' + q.level);
    return x.length ? `<div class="sub">${esc(x.join('\n'))}</div>` : '';
  }
  function nextLabel() {
    const u = curUnit();
    if (SES.qi + 1 < u.play.length) return '次の問題 →';
    if (SES.sub !== 'M' && S.settings.summary) return 'テーマの結果を見る →';
    return SES.ui + 1 < SES.units.length ? (SES.sub === 'M' ? '次の問題 →' : '次のテーマへ →') : '結果を見る →';
  }
  function answer(i) {
    if (SES.answered) return;
    const o = SES.choices[i]; const u = curUnit(); const q = QBY[u.play[SES.qi]];
    SES.answered = true;
    finish(q, o.correct, o.text);
    document.querySelectorAll('.choice').forEach((b, j) => { const c = SES.choices[j]; b.classList.add(c.correct ? 'correct' : j === i ? 'wrong' : 'dim'); b.disabled = true; });
    const shown = SES.choices.find(c => c.correct).label; const full = ansText(q);
    document.getElementById('fb').innerHTML = `<div class="result ${o.correct ? 'ok' : 'ng'}"><div class="big">${o.correct ? '○ 正解' : '× 不正解'}</div>
      ${o.correct ? (shown !== full ? `<div class="sub">Excel記載：${esc(full)}</div>` : '') : `<div class="ans">正答：${esc(full)}</div>`}${memoHtml(q)}</div>
      <button class="nextbtn" data-act="next">${nextLabel()}</button>`;
    afterAnswerUI(u);
  }
  function reveal() {
    const u = curUnit(); const q = QBY[u.play[SES.qi]];
    const rv = document.querySelector('[data-act=reveal]'); if (rv) rv.remove();
    document.getElementById('fb').innerHTML = `<div class="ansbox">${esc(ansText(q))}${memoHtml(q)}</div>
      <div class="selfbtns"><button class="o" data-act="self" data-v="1">○ 合ってた</button><button class="x" data-act="self" data-v="0">× 違った</button></div>`;
  }
  function selfGrade(ok) {
    if (SES.answered) return;
    const u = curUnit(); const q = QBY[u.play[SES.qi]];
    SES.answered = true; finish(q, ok, null); next();
  }
  function finish(q, ok, chosen) {
    record(q.id, ok);
    SES.res[SES.qi] = ok; SES.n++; if (ok) SES.c++;
    SES.chosen = SES.chosen || {}; SES.chosen[SES.qi] = chosen;
  }
  function afterAnswerUI(u) {
    const d = document.querySelectorAll('.theme .dot');
    if (d[SES.qi]) { d[SES.qi].classList.remove('cur'); d[SES.qi].classList.add(SES.res[SES.qi] ? 'o' : 'x'); }
    const nb = document.querySelector('.nextbtn'); if (nb) nb.focus({ preventScroll: true });
    if (window.innerWidth < 700) document.getElementById('fb').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  function next() {
    const u = curUnit();
    if (SES.qi + 1 < u.play.length) { SES.qi++; renderQ(); return; }
    // テーマ（ユニット）完了
    if (SES.mode === 'seq') { S.ptr[SES.sub] = (u.idx + 1) % UNITS[SES.sub].length; save(); }
    SES.log.push({ idx: u.idx, res: SES.res.slice(), chosen: Object.assign({}, SES.chosen || {}) });
    if (SES.sub !== 'M' && S.settings.summary) renderThemeSum(); else advance();
  }
  function advance() {
    SES.ui++; SES.qi = 0; SES.res = []; SES.chosen = {};
    if (SES.ui >= SES.units.length) renderEnd(); else renderQ();
  }
  function retryTheme() { SES.log.pop(); SES.qi = 0; SES.res = []; SES.chosen = {}; renderQ(); }

  function renderThemeSum() {
    const u = curUnit(); const sub = SES.sub; const last = SES.log[SES.log.length - 1];
    const ok = last.res.filter(Boolean).length;
    const rows = u.play.map((id, i) => {
      const q = QBY[id]; const r = last.res[i];
      return `<div class="sumrow"><div class="m ${r ? 'ok' : 'ng'}">${r ? '○' : '×'}</div><div class="b"><div class="s">問${q.pos}</div>${esc(qText(q))}
        <div class="a">${sub === 'V' ? '正答 ' + q.correctAnswer + (r ? '' : `（あなた：${esc(last.chosen[i] || '')}）`) : esc(ansText(q))}</div>${q.memo ? `<div class="s">備考：${esc(q.memo)}</div>` : ''}</div></div>`;
    }).join('');
    const seq = sub === 'V' ? `<div class="muted">正答の並び</div><div class="seq">${u.play.map(id => QBY[id].correctAnswer).join(' ')}</div>` : '';
    const more = SES.ui + 1 < SES.units.length;
    view(`<header class="top"><button class="iconbtn" data-act="quit">終了</button><h1 style="font-size:15px">テーマ${u.no} の結果</h1><div class="prog">${SUBJ[sub].u} ${SES.ui + 1}/${SES.units.length}</div></header>
      <div class="card"><div class="theme"><span class="tno">${SUBJ[sub].name} テーマ${u.no}</span><span class="tt">${esc(u.title)}</span></div>
        <div class="result ${ok === u.play.length ? 'ok' : 'ng'}" style="margin-top:0"><div class="big">${ok} / ${u.play.length} 問正解</div></div>
        ${seq}<div style="margin-top:8px">${rows}</div>
        <button class="nextbtn" data-act="advance">${more ? '次のテーマへ →（Enter）' : '結果を見る →'}</button>
        <div class="row" style="margin-top:10px"><button class="btn" data-act="retry">このテーマをもう一度</button><button class="btn" data-act="quit">ここで終了</button></div></div>`,
      e => { if (e.key === 'Enter') { e.preventDefault(); advance(); } });
  }

  function renderEnd() {
    if (!SES) return renderHome();
    const sub = SES.sub; const s = SES;
    const bad = s.log.filter(l => l.res.some(r => r === false));
    view(`<header class="top"><button class="iconbtn" data-act="home">←</button><h1>おつかれさまでした</h1></header>
      <div class="card"><div class="stats"><div class="stat"><div class="v">${s.n}</div><div class="t">回答数</div></div><div class="stat"><div class="v">${s.n ? Math.round(s.c / s.n * 100) : 0}%</div><div class="t">正答率（○${s.c}）</div></div>
      <div class="stat"><div class="v">${s.log.length}</div><div class="t">終えた${SUBJ[sub].u}</div></div><div class="stat"><div class="v ${bad.length ? 'ng' : ''}">${bad.length}</div><div class="t">×があった${SUBJ[sub].u}</div></div></div>
      ${bad.length ? `<h3>×があった${SUBJ[sub].u}</h3>${bad.map(l => { const u = UNITS[sub][l.idx]; return `<div class="muted">・${unitName(sub, u)}${u.title ? esc(brk(u.title)) : '　' + esc(qText(QBY[u.play[0]]))}　${l.res.map(r => r ? '○' : '×').join('')}</div>`; }).join('')}` : ''}
      <div class="row" style="margin-top:14px">${bad.length ? `<button class="btn pri" data-act="redo">×があった${SUBJ[sub].u}をやり直す</button>` : ''}<button class="btn" data-act="subj" data-s="${sub}">${SUBJ[sub].name}メニューへ</button><button class="btn" data-act="home">ホーム</button></div></div>`);
  }
  function redo() {
    const sub = SES.sub; const idxs = [...new Set(SES.log.filter(l => l.res.some(r => r === false)).map(l => l.idx))];
    SES = { sub, mode: 'wrong', units: idxs, ui: 0, qi: 0, res: [], n: 0, c: 0, log: [] }; renderQ();
  }
  function quit() { if (SES && SES.n) renderEnd(); else if (SES) renderSubj(SES.sub); else renderHome(); }

  // ---------- 一覧 ----------
  let LF = { f: 'all', q: '' };
  function renderList(sub, keepFilter) {
    EDIT = null; SES = null; if (!keepFilter) LF = { f: 'all', q: '' };
    view(`<header class="top"><button class="iconbtn" data-act="subj" data-s="${sub}">←</button><h1>${SUBJ[sub].name}の一覧</h1></header>
      <input type="search" id="lq" placeholder="${sub === 'M' ? '問題・答えで検索' : 'テーマ名・問題文・答えで検索'}" value="${esc(LF.q)}">
      <div class="filters">${[['all', 'すべて'], ['unseen', '未出題あり'], ['wrong', '前回×あり'], ['done', '定着'], ['edited', '編集済み']].map(([k, t]) => `<button class="chip ${LF.f === k ? 'on' : ''}" data-act="lf" data-f="${k}" data-s="${sub}">${t}</button>`).join('')}</div>
      <p class="muted">登録問題の修正は各問題の「編集」から。変更はこのブラウザ内に保存されます。</p>${legend}<div id="ul"></div>`);
    const inp = document.getElementById('lq');
    inp.addEventListener('input', () => { LF.q = inp.value; drawList(sub); });
    drawList(sub);
  }
  function drawList(sub) {
    const qk = key(LF.q);
    const us = UNITS[sub].filter(u => {
      if (LF.f === 'edited' && !u.ids.some(id => S.edits[id])) return false;
      if (LF.f === 'unseen' && !u.play.some(id => !seen(id))) return false;
      if (LF.f === 'wrong' && !u.play.some(isWrong)) return false;
      if (LF.f === 'done' && !(u.play.length && u.play.every(id => lv(id) === 4))) return false;
      if (qk) { const hay = key([u.title, ...u.ids.map(id => (QBY[id].question || '') + ' ' + (QBY[id].correctAnswer || ''))].join(' ')); if (!hay.includes(qk)) return false; }
      return true;
    });
    const html = us.slice(0, 400).map(u => {
      const can = u.play.length > 0;
      const dots = u.ids.map(id => { const q = QBY[id]; return `<span class="dot l${q.status === 'ok' ? lv(id) : 0}" title="${esc(q.excelNo)}">${sub === 'M' ? (q.status === 'ok' ? '' : '－') : '問' + q.pos}</span>`; }).join('');
      if (sub === 'M') {
        const q = QBY[u.ids[0]];
        return `<div class="unit ${can ? '' : 'off'}"><div class="h"><span class="n">No.${u.no}</span><span class="t">${esc(q.question || '（空欄）')}${q.level ? ` <span class="star">${esc(q.level)}</span>` : ''}${S.edits[q.id] ? ' <span class="editbadge">編集済み</span>' : ''}</span><span class="dot l${can ? lv(q.id) : 0}" style="min-width:18px;height:18px"></span></div>
          ${can ? `<details><summary>答えを見る</summary><ol style="list-style:none;padding-left:0"><li class="ca">${esc(half(q.correctAnswer))}</li>${q.memo ? `<li class="muted">備考：${esc(q.memo)}</li>` : ''}</ol></details>
          <div class="acts"><button class="btn" data-act="from" data-s="M" data-i="${u.idx}">▶ ここから順番に</button><button class="btn" data-act="one" data-s="M" data-i="${u.idx}">この問題だけ</button></div>` : '<div class="muted">問題の答えが空欄のため出題対象外</div>'}<div class="acts"><button class="btn" data-act="editq" data-id="${q.id}">問題を編集</button></div></div>`;
      }
      return `<div class="unit ${can ? '' : 'off'}"><div class="h"><span class="n">${u.no}</span><span class="t">${esc(u.title)}${u.note ? ` <span class="warn" style="font-size:12px">※${esc(u.note)}</span>` : ''}</span></div>
        <div class="dots">${dots}</div>
        <details><summary>問題と答えを見る（${u.ids.length}問）</summary><ol>${u.ids.map(id => { const q = QBY[id]; return `<li value="${q.pos}">${esc(qText(q))}<br><span class="ca">${q.status === 'ok' ? '→ ' + esc(sub === 'V' ? ABC_LABEL[q.correctAnswer] : half(q.correctAnswer)) : '<span class="warn">→ 答えの記載なし（出題対象外）</span>'}</span>${q.memo ? `<br><span class="muted">備考：${esc(q.memo)}</span>` : ''}<div class="editline">${S.edits[id] ? '<span class="editbadge">編集済み</span>' : ''}<button class="btn smallbtn" data-act="editq" data-id="${id}">問${q.pos}を編集</button></div></li>`; }).join('')}</ol>
        ${sub === 'V' && can ? `<div class="muted">正答の並び：<b>${u.play.map(id => QBY[id].correctAnswer).join(' ')}</b></div>` : ''}</details>
        ${can ? `<div class="acts"><button class="btn pri" data-act="one" data-s="${sub}" data-i="${u.idx}">このテーマだけ</button><button class="btn" data-act="from" data-s="${sub}" data-i="${u.idx}">▶ ここから順番に</button></div>` : '<div class="muted">答えの記載がないため出題対象外</div>'}</div>`;
    }).join('');
    document.getElementById('ul').innerHTML = (us.length ? `<div class="muted">${us.length}件</div>` : '<p class="muted">該当なし</p>') + html;
  }

  // ---------- 問題の編集（元データを変更せずブラウザ保存の差分を適用） ----------
  let EDIT = null;
  function cleanQuestionEdit(id, raw) {
    const base = BASE_QBY[id];
    if (!base || !raw || typeof raw !== 'object' || Array.isArray(raw)) throw Error('問題の編集データが不正です');
    const out = {};
    for (const field of ['question', 'correctAnswer', 'memo', 'level']) {
      const val = raw[field] == null ? (base[field] || '') : raw[field];
      if (typeof val !== 'string' || val.length > 50000) throw Error(id + '：入力が長すぎるか形式が不正です');
      out[field] = val.trim();
    }
    if (base.type === 'abc') {
      out.correctAnswer = half(out.correctAnswer).toUpperCase();
      if (out.correctAnswer && !['A', 'B', 'C'].includes(out.correctAnswer)) throw Error(id + '：正答はA・B・Cから選んでください');
      out.distractors = ['A', 'B', 'C'].filter(a => a !== out.correctAnswer);
    } else {
      const ds = raw.distractors == null ? (base.distractors || []) : raw.distractors;
      if (!Array.isArray(ds) || ds.length > 100 || ds.some(x => typeof x !== 'string' || x.length > 10000)) throw Error(id + '：誤答の選択肢の形式が不正です');
      out.distractors = ds.map(d => d.trim()).filter(Boolean);
      const visible = new Set([key(dispOpt(out.correctAnswer, base.subject))]);
      for (const d of out.distractors) {
        const k = key(dispOpt(d, base.subject));
        if (visible.has(k)) throw Error('正答と誤答、または誤答同士の表示が重複しています。選択肢を修正してください');
        visible.add(k);
      }
      if (out.correctAnswer && out.distractors.length < 3) throw Error('4択用に、異なる誤答の選択肢を3つ以上入力してください');
    }
    out.status = out.correctAnswer ? 'ok' : 'missing';
    return out;
  }
  function normalizeEdits(raw) {
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) throw Error('問題の編集データが不正です');
    const out = {};
    for (const id of Object.keys(raw)) {
      if (!Object.prototype.hasOwnProperty.call(BASE_QBY, id)) throw Error('このアプリにない問題IDが含まれています：' + id);
      out[id] = cleanQuestionEdit(id, raw[id]);
    }
    return out;
  }
  function editorDistractors(q) {
    const used = new Set([key(dispOpt(q.correctAnswer || '', q.subject))]);
    return (q.distractors || []).filter(d => {
      const k = key(dispOpt(d, q.subject));
      if (!k || used.has(k)) return false;
      used.add(k); return true;
    });
  }
  function editorValues() {
    const form = document.getElementById('qedit');
    if (!form) return null;
    const f = form.elements;
    return { question: f.question.value, correctAnswer: f.correctAnswer.value,
      distractors: f.distractors ? f.distractors.value.split('\n').map(s => s.trim()).filter(Boolean) : [],
      memo: f.memo.value, level: f.level ? f.level.value : '', resetRecord: f.resetRecord.checked };
  }
  function editorDirty() { return !!(EDIT && document.getElementById('qedit') && JSON.stringify(editorValues()) !== EDIT.initial); }
  function renderEditor(id) {
    const q = QBY[id]; if (!q) return;
    SES = null;
    const sub = q.subject, u = UNITS[sub].find(u => u.ids.includes(id));
    EDIT = { id, sub };
    const original = BASE_QBY[id];
    view(`<header class="top"><button class="iconbtn" data-act="editback">← 一覧へ</button><h1>問題を編集</h1></header>
      <div class="card"><div class="muted">${SUBJ[sub].name} ${unitName(sub, u)}${sub === 'M' ? '' : '・問' + q.pos}<br>${esc(u.title)}<br>${esc(q.excelNo || id)} ${S.edits[id] ? '<span class="editbadge">編集済み</span>' : ''}</div>
        <p class="muted">問題番号とテーマ内の順番は変わりません。保存後の出題・正誤判定に反映されます。</p>
        <form id="qedit" novalidate>
          <label class="editfield">問題文<textarea name="question" rows="4" maxlength="50000">${esc(q.question || '')}</textarea></label>
          <label class="editfield">正答${sub === 'V' ? `<select name="correctAnswer"><option value="">未設定（出題しない）</option>${['A','B','C'].map(a => `<option value="${a}" ${q.correctAnswer === a ? 'selected' : ''}>${ABC_LABEL[a]}</option>`).join('')}</select>` : `<textarea name="correctAnswer" rows="2" maxlength="50000">${esc(q.correctAnswer || '')}</textarea>`}</label>
          <p class="muted">正答を空欄にすると出題対象外になります。未収録の答えは確認できた内容だけ入力してください。</p>
          ${sub !== 'V' ? `<label class="editfield">誤答の選択肢（1行に1つ）<textarea name="distractors" rows="7">${esc(editorDistractors(q).join('\n'))}</textarea></label><p class="muted">異なる誤答を3つ以上入力してください。4つ以上ある場合は出題時に3つ選びます。正答を含めて表示順はランダムです。表示時に訳語・括弧のメモ等が省略されるため、見た目で重複する選択肢は保存できません。元データ内で重複する候補はこの入力欄では省いています。</p>` : ''}
          <label class="editfield">備考・解説<textarea name="memo" rows="3" maxlength="50000">${esc(q.memo || '')}</textarea></label>
          ${sub === 'M' ? `<label class="editfield">難易度<select name="level">${['', '★', '★★', '★★★', '★★★★', ...(q.level && !['★','★★','★★★','★★★★'].includes(q.level) ? [q.level] : [])].map(x => `<option value="${esc(x)}" ${(q.level || '') === x ? 'selected' : ''}>${esc(x || '未設定')}</option>`).join('')}</select></label>` : ''}
          <label class="sw"><input type="checkbox" name="resetRecord"><span>保存時に、この問題の学習記録をリセットする<br><small class="muted">チェックしない場合は、これまでの学習記録を残します。今日の集計は変わりません。</small></span></label>
          <div id="edit-error" class="editerror" role="alert" tabindex="-1"></div>
          <div class="row"><button type="submit" class="btn pri">変更を保存</button><button type="button" class="btn" data-act="editback">一覧へ戻る</button></div>
        </form>
      </div>
      <div class="card"><h2>元データに戻す</h2><p class="muted">この問題だけ、配布されたアプリの元の問題文・答え・選択肢に戻します。学習記録は消しません。</p><details><summary>元の問題文と正答を確認</summary><div class="original-text">${esc(original.question || '（空欄）')}<br>正答：${esc(original.correctAnswer || '（未設定）')}</div></details><button class="btn danger" style="margin-top:12px" data-act="restoreq" ${S.edits[id] ? '' : 'disabled'}>この問題を元に戻す</button></div>
      <p class="muted">保存先はこの端末・ブラウザ内だけです。GitHubのファイルは変更しません。設定の「書き出し」で学習記録と編集内容をまとめてバックアップできます。</p>`);
    EDIT.initial = JSON.stringify(editorValues());
    document.getElementById('qedit').addEventListener('submit', e => { e.preventDefault(); saveQuestionEdit(); });
  }
  function saveQuestionEdit() {
    const id = EDIT.id, error = document.getElementById('edit-error');
    error.textContent = '';
    let draft;
    try { draft = cleanQuestionEdit(id, editorValues()); }
    catch (e) { error.textContent = e.message; error.focus(); return; }
    const prev = S, v = editorValues();
    S = Object.assign({}, S, { edits: Object.assign({}, S.edits, { [id]: draft }), items: Object.assign({}, S.items) });
    if (v.resetRecord) delete S.items[id];
    if (!save()) { S = prev; error.textContent = '保存に失敗しました。入力内容は残っています。容量・ブラウザの設定を確認してください。'; return; }
    applyQuestionEdits(); renderEditor(id); toast('問題の変更を保存しました');
  }
  function restoreQuestion() {
    if (!EDIT || !S.edits[EDIT.id]) return;
    if (!confirm('この問題の編集内容' + (editorDirty() ? 'と保存していない入力' : '') + 'を破棄し、元データに戻しますか？学習記録は残します。')) return;
    const id = EDIT.id, prev = S;
    S = Object.assign({}, S, { edits: Object.assign({}, S.edits) });
    delete S.edits[id];
    if (!save()) { S = prev; return; }
    applyQuestionEdits(); renderEditor(id); toast('この問題を元データに戻しました');
  }


  // ---------- 設定 ----------
  function renderSettings() {
    SES = null;
    const sel = s => `<select data-fmt="${s}"><option value="choice" ${S.settings.fmt[s] === 'choice' ? 'selected' : ''}>4択</option><option value="self" ${S.settings.fmt[s] === 'self' ? 'selected' : ''}>自己採点（答えを見て○×）</option></select>`;
    const cnt = ORDER.map(s => `${SUBJ[s].name}：${s === 'M' ? '' : UNITS[s].length + 'テーマ・'}${UNITS[s].reduce((a, u) => a + u.ids.length, 0)}問（出題対象 ${UNITS[s].reduce((a, u) => a + u.play.length, 0)}問）`).join('<br>');
    view(`<header class="top"><button class="iconbtn" data-act="home">←</button><h1>設定</h1></header>
      <div class="card"><h2>回答形式</h2>
        <label class="sw" style="align-items:center">計数　${sel('M')}</label><label class="sw" style="align-items:center">英語　${sel('E')}</label>
        <p class="muted">言語は常に A／B／C の3択です。4択の誤答はExcelの他の答えなどから自動で作っています。</p>
        <label class="sw"><input type="checkbox" id="sumck" ${S.settings.summary ? 'checked' : ''}><span>テーマを解き終えるたびに結果（正答の並びなど）を表示する</span></label></div>
      <div class="card"><h2>問題を編集</h2><p class="muted">各科目の一覧から、問題文・正答・誤答の選択肢・備考を修正できます。テーマと問題番号は変わりません。編集済み ${Object.keys(S.edits).length}問。</p>
        <div class="row">${ORDER.map(s => `<button class="btn" data-act="list" data-s="${s}">${SUBJ[s].name}の問題を編集</button>`).join('')}</div>
        <p class="muted">変更はこのブラウザだけに保存され、GitHubや他の端末へ自動反映されません。下のJSON書き出しに編集内容も含まれます。</p></div>
      <div class="card"><h2>学習記録・編集内容のバックアップ</h2><p class="muted">学習記録・設定・編集した問題をまとめて保存します。機種変更・別ブラウザへ移すときは書き出し→読み込みしてください。読み込みは学習記録と設定を上書きします。編集内容を含むファイルでは編集内容も上書きします。</p>
        <div class="row"><button class="btn" data-act="export">書き出し（JSON）</button><button class="btn" data-act="import">読み込み</button><input type="file" id="impf" accept=".json,application/json" hidden></div>
        <h3>学習記録のリセット</h3><p class="muted">問題の編集内容は消えません。各問題の編集画面で元データに戻せます。</p><div class="row">${ORDER.map(s => `<button class="btn danger" data-act="reset" data-s="${s}">${SUBJ[s].name}をリセット</button>`).join('')}<button class="btn danger" data-act="reset" data-s="all">すべてリセット</button></div></div>
      <div class="card"><h2>収録データ</h2><p class="muted">${esc(D.source)}<br>${cnt}</p>
        <h3>取り込み時の注意点</h3><ul class="muted" style="padding-left:18px;margin:0">${D.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul></div>`);
    document.querySelectorAll('select[data-fmt]').forEach(el => el.addEventListener('change', () => { S.settings.fmt[el.dataset.fmt] = el.value; save(); toast('保存しました'); }));
    document.getElementById('sumck').addEventListener('change', e => { S.settings.summary = e.target.checked; save(); });
    document.getElementById('impf').addEventListener('change', e => {
      const f = e.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        try {
          const data = JSON.parse(r.result);
          if (!data || data.app !== 'gab10-trainer') throw Error('このアプリの書き出しファイルではありません');
          const nextState = merge(data);
          const hasEdits = Object.prototype.hasOwnProperty.call(data, 'edits');
          if (!hasEdits) nextState.edits = S.edits; // 旧版の記録ファイルでは現在の編集内容を保つ
          if (!confirm('ファイルの学習記録・設定' + (hasEdits ? '・問題の編集内容で上書きします。' : 'で上書きします。現在の問題編集は残します。') + 'よろしいですか？')) { e.target.value = ''; return; }
          const prev = S; S = nextState;
          if (!save()) { S = prev; return; }
          applyQuestionEdits(); toast('読み込みました'); renderSettings();
        } catch (err) { toast(err.message || '読み込めないファイルです'); }
      };
      r.readAsText(f);
    });
  }
  function doExport() {
    const b = new Blob([JSON.stringify(S)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `gab10_記録と問題編集_${today()}.json`; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
  function doReset(s) {
    if (!confirm(s === 'all' ? 'すべての学習記録を消去します。よろしいですか？' : SUBJ[s].name + 'の学習記録を消去します。よろしいですか？')) return;
    if (s === 'all') { const edits = S.edits; S = blank(); S.edits = edits; }
    else { UNITS[s].forEach(u => u.ids.forEach(id => delete S.items[id])); S.ptr[s] = 0; }
    save(); toast('リセットしました'); renderSettings();
  }

  // ---------- イベント ----------
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
    const a = t.dataset.act, s = t.dataset.s;
    if (t.tagName === 'A') e.preventDefault();
    switch (a) {
      case 'home': renderHome(); break;
      case 'subj': renderSubj(s); break;
      case 'list': renderList(s); break;
      case 'settings': renderSettings(); break;
      case 'editq': renderEditor(t.dataset.id); break;
      case 'editback': if (!editorDirty() || confirm('保存していない変更を破棄して一覧へ戻りますか？')) renderList(EDIT.sub, true); break;
      case 'restoreq': restoreQuestion(); break;
      case 'start': start(s, t.dataset.m); break;
      case 'from': start(s, 'seq', +t.dataset.i); break;
      case 'one': start(s, 'one', +t.dataset.i); break;
      case 'ans': answer(+t.dataset.i); break;
      case 'reveal': reveal(); break;
      case 'self': selfGrade(t.dataset.v === '1'); break;
      case 'next': next(); break;
      case 'advance': advance(); break;
      case 'retry': retryTheme(); break;
      case 'quit': quit(); break;
      case 'redo': redo(); break;
      case 'lf': LF.f = t.dataset.f; renderList(s, true); break;
      case 'resetptr': S.ptr[s] = 0; save(); renderSubj(s); toast('最初に戻しました'); break;
      case 'export': doExport(); break;
      case 'import': document.getElementById('impf').click(); break;
      case 'reset': doReset(s); break;
    }
  });
  document.addEventListener('keydown', e => { if (keyHandler && !e.metaKey && !e.ctrlKey && !e.altKey && !['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName) && !e.target.isContentEditable) keyHandler(e); });

  window.addEventListener('beforeunload', e => { if (editorDirty()) { e.preventDefault(); e.returnValue = ''; } });

  window.__gab = { applyQuestionEdits, normalizeEdits, renderEditor, renderList, renderSettings, UNITS, QBY, buildOrder, buildChoices, dispOpt, lv, start, get SES() { return SES; }, answer, next, advance, selfGrade, get S() { return S; } };
  renderHome();
})();
</script></body></html>
